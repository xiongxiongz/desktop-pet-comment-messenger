<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>桌宠</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <div id="stage">
      <!-- 评论气泡（默认隐藏） -->
      <div id="bubble" class="bubble hidden" role="dialog" aria-label="粉丝评论">
        <div class="bubble-header">
          <span id="bubble-tag" class="tag"></span>
          <span id="bubble-like" class="like"></span>
        </div>
        <p id="bubble-text" class="bubble-text"></p>
        <div class="bubble-meta">
          <span id="bubble-author" class="author"></span>
          <span id="bubble-video" class="video" title="来自视频"></span>
        </div>
        <div class="bubble-actions">
          <button id="btn-fav" type="button" title="收藏">☆ 收藏</button>
          <button id="btn-skip" type="button" title="跳过">跳过 ✕</button>
        </div>
        <div class="bubble-tail"></div>
      </div>

      <!-- 桌宠本体 -->
      <div id="pet" class="pet" title="双击打开设置">
        <div id="pet-name" class="pet-name"></div>
        <div id="pet-body" class="pet-body"></div>
      </div>
    </div>
    <script type="module" src="./pet.ts"></script>
  </body>
</html>
