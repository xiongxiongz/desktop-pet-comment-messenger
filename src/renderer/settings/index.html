<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' pet-skin: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>桌宠评论信使</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main class="wrap">

      <nav class="tabs">
        <button id="tabSettings" type="button" class="tab active" data-tab="settings">设置</button>
        <button id="tabFavorites" type="button" class="tab" data-tab="favorites">收藏</button>
      </nav>

      <div id="panelSettings" class="panel active">
        <section class="card">
          <h2>桌宠</h2>
          <label>桌宠名称（推荐设置为粉丝称呼）<input id="petName" type="text" maxlength="12" placeholder="如：家人们" /></label>
          <label>皮肤
            <select id="skin">
              <option value="cat">猫</option>
              <option value="dog">狗</option>
              <option value="robot">机器人</option>
              <option value="custom">DIY皮肤</option>
            </select>
          </label>
          <div id="customSkinField" class="custom-skin-field" hidden>
            <div class="skin-library-head">
              <strong>我的皮肤</strong>
              <span class="skin-library-head-actions">
                <button id="btnImportSkin" type="button" class="mini">添加皮肤</button>
              </span>
            </div>
            <div id="skinFolderForm" class="skin-folder-form" hidden>
              <input id="skinFolderName" type="text" maxlength="24" placeholder="输入新建文件夹名称" aria-label="新建文件夹名称" />
              <button id="btnConfirmSkinFolder" type="button" class="mini primary">创建</button>
              <button id="btnCancelSkinFolder" type="button" class="mini">取消</button>
            </div>
            <div id="customSkinPreviewStage" class="custom-skin-preview-stage" hidden>
              <img id="customSkinPreview" class="custom-skin-preview" alt="当前自定义皮肤预览" />
            </div>
            <p id="customSkinHint" class="hint"></p>
            <div id="customSkinLibrary" class="custom-skin-library"></div>
          </div>
          <div id="skinAdjustments" class="custom-skin-adjustments">
            <div class="skin-scale-mode" role="group" aria-label="皮肤缩放方式">
              <span>缩放方式</span>
              <div class="skin-scale-mode-buttons">
                <button id="btnContentScaleMode" type="button" class="mini active" aria-pressed="true">仅缩放图片</button>
                <button id="btnFrameScaleMode" type="button" class="mini" aria-pressed="false">整体缩放（含限制框）</button>
              </div>
            </div>
            <label>显示大小 <span id="customSkinScaleValue">100%</span>
              <input id="customSkinScale" type="range" min="50" max="200" step="5" value="100" />
            </label>
            <div class="skin-move-row">
              <span>位置</span>
              <div class="skin-move-buttons" aria-label="调整皮肤位置">
                <button id="btnSkinUp" type="button" class="mini" aria-label="向上移动">↑</button>
                <button id="btnSkinLeft" type="button" class="mini" aria-label="向左移动">←</button>
                <button id="btnSkinReset" type="button" class="mini">重置</button>
                <button id="btnSkinRight" type="button" class="mini" aria-label="向右移动">→</button>
                <button id="btnSkinDown" type="button" class="mini" aria-label="向下移动">↓</button>
              </div>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>想看的评论类型</h2>
          <div id="tags" class="tags"></div>
        </section>

        <section class="card">
          <h2>推送设置</h2>
          <label class="row">开启推送<input id="pushEnabled" type="checkbox" /></label>
          <label>活跃时段
            <span class="range"><input id="activeStart" type="time" /> — <input id="activeEnd" type="time" /></span>
          </label>
          <label>免打扰时段
            <span class="range"><input id="dndStart" type="time" /> — <input id="dndEnd" type="time" /></span>
          </label>
          <label>每日推送上限<input id="dailyCap" type="number" min="1" max="200" /></label>
          <label>推送间隔（秒）
            <span class="range"><input id="minInterval" type="number" min="5" /> — <input id="maxInterval" type="number" min="5" /></span>
          </label>
        </section>

        <section class="card">
          <h2>智能分类（默认启用）</h2>
          <label class="row">启用大模型分类 (glm-5.2)<input id="llmEnabled" type="checkbox" /></label>
          <label>网关 API Key<input id="llmKey" type="password" placeholder="留空则用 .env 或纯规则" /></label>
          <p id="llmHint" class="hint"></p>
        </section>

        <section class="card">
          <h2>评论数据</h2>
          <button id="btnFilter" type="button" class="primary">加载并筛选评论</button>
          <p id="filterResult" class="result"></p>
          <button id="btnPushOne" type="button">来一条 →</button>
        </section>
      </div>

      <div id="panelFavorites" class="panel">
        <section class="card">
          <div class="card-head">
            <h2>我的收藏</h2>
            <button id="btnRefreshFav" type="button" class="mini">刷新</button>
          </div>
          <div id="favList" class="fav-list"></div>
        </section>
      </div>

      <div class="footer">
        <span id="saveStatus" class="save-status"></span>
      </div>
    </main>
    <div id="skinCropDialog" class="skin-crop-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="skinCropTitle">
      <section class="skin-crop-card">
        <h2 id="skinCropTitle">调整新皮肤</h2>
        <p class="hint">在方框内拖动图片，调整到满意的位置后再确认使用。</p>
        <div id="skinCropStage" class="skin-crop-stage">
          <img id="skinCropImage" class="skin-crop-image" alt="待确认的自定义皮肤" draggable="false" />
        </div>
        <label>皮肤名称
          <input id="skinCropName" type="text" maxlength="24" placeholder="给这张皮肤起个名字" />
        </label>
        <label>保存到文件夹
          <select id="skinCropFolder" aria-label="保存到皮肤文件夹"></select>
        </label>
        <label>显示形状
          <select id="skinCropShape" aria-label="皮肤显示形状">
            <option value="square">方形</option>
            <option value="circle">圆形裁切</option>
          </select>
        </label>
        <label>大小 <span id="skinCropScaleValue">100%</span>
          <input id="skinCropScale" type="range" min="50" max="200" step="5" value="100" />
        </label>
        <div class="skin-crop-actions">
          <button id="btnCancelSkinCrop" type="button">取消</button>
          <button id="btnConfirmSkinCrop" type="button" class="primary">确认使用</button>
        </div>
      </section>
    </div>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
